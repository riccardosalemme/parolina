<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Parolina: scrivi testi con i simboli CAA (ARASAAC). I simboli compaiono da soli, anche per i verbi coniugati." />
    <meta name="theme-color" content="#fbf6f1" media="(prefers-color-scheme: light)" />

    <link rel="manifest" href="../manifest.webmanifest" />

    <script>try { var t = localStorage.getItem('parolina:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}</script>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
